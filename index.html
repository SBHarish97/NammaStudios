<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Namma</title>
    <style>
        /* Basic reset */
        body,
        html {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #FAFAFA;
            color: #111;
        }

        /* Dummy content to allow scrolling so we can see the floating elements */
        .content-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        html,
        body {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }
    </style>
</head>

<body>

    

    <!-- Custom cursor logic -->
    <script src="cursor.js"></script>

    <!-- Link the JS file which generates the footer -->
    <script src="footer.js"></script>

    <!-- Smooth Scrolling (Lenis) -->
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            autoRaf: true,
            duration: 1.2, // Adjusts how slow/smooth the scroll feels
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });
    </script>
</body>

</html>
