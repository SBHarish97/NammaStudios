<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — Studio Namma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <link rel="stylesheet" href="./studio.css">
</head>

<body>


  <section class="hero" id="studioHero">
    <div id="pixelsGallery"></div>
    <div class="hero-content">
      <h1 class="hero-line"><span>BEHIND</span></h1>
      <h1 class="hero-line"><span>THE PIXELS</span></h1>
    </div>
    <span class="hero-scroll mono">Scroll</span>
  </section>


  <section id="about">
    <p class="eyebrow">About</p>
    <p id="aboutText" class="body-text"></p>
    <div id="teamRow"></div>
  </section>


 <section id="fuel">



  <div class="fuel-hero" id="fuelHero">

    <div class="fuel-line">
      <span class="fuel-line-mask"><span class="fuel-reveal">THE FUEL</span></span>
    </div>

    <div class="fuel-line fuel-line-image">

      <img
        id="fuelFloatImage"
        class="fuel-reveal"
        src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68d14af05e0d62345efe539e_1.webp"
        alt=""
      >

      <span class="fuel-line-mask"><span class="fuel-reveal">BEHIND</span></span>

    </div>

    <div class="fuel-line">
      <span class="fuel-line-mask"><span class="fuel-reveal">THE CRAFT</span></span>
    </div>


    <div
      id="fuelCursor"
      class="fuel-cursor"
    ></div>

  </div>




  <div id="fuelList"></div>

</section>

  <section id="cta"></section>


  <div id="statusBar" class="mono">
    <span>We craft bold design &amp; clean Webflow.</span>
    <span id="statusClock">Paris, France&nbsp;&nbsp;--:--</span>
  </div>

</body>
<script src="studio.js"></script>
<script src="cursor.js"></script>
<script src="footer.js"></script>
    <script src = "nav.js"></script>


</html>
